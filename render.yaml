services:
  - type: web
    name: sigma-live-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: sigma-round-memory
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MEMORY_LIMIT
        value: "3000"
      - key: ROUND_MEMORY_FILE
        value: "/var/data/sigma-rounds.json"
      - key: SIGMA_COLOR_24H_ENABLED
        value: "true"
      - key: SIGMA_WHITE_24H_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WHITE_CHAT_ID
        sync: false
