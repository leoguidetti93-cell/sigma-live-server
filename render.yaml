services:
  - type: web
    name: sigma-live-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MEMORY_LIMIT
        value: "500"
      - key: BLAZE_ORIGIN
        value: "https://blaze.bet.br"
      - key: ALLOWED_ORIGINS
        value: "*"
